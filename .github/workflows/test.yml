name: Dashboard Tests

on:
  push:
    branches: [dashboard]
  pull_request:
    branches: [dashboard]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go tests
        working-directory: dashboard/bin/go
        run: go test ./...
